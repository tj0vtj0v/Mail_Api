name: mail_api

services:
  burdorf.dev:
    image: local/mail-api:latest
    build:
      context: .
    environment:
      CONFIG_DIR: /app/config
      CONFIG_DEFAULTS_FILE: /app/defaults.json
    volumes:
      - ./config/defaults.json:/app/defaults.json:ro
      - ./config/professional:/app/config:ro
    networks:
      - web
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/health"]
      interval: 60s
      timeout: 10s
      retries: 3

  herborn-ferienwohnung.de:
    image: local/mail-api:latest
    environment:
      CONFIG_DIR: /app/config
      CONFIG_DEFAULTS_FILE: /app/defaults.json
    volumes:
      - ./config/defaults.json:/app/defaults.json:ro
      - ./config/herborn:/app/config:ro
    networks:
      - web
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/health"]
      interval: 60s
      timeout: 10s
      retries: 3

networks:
  web:
    external: true
