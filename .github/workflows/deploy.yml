name: Deploy Mail Api

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: deploy to server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ vars.DEPLOY_IP }}
          username: ${{ secrets.DEPLOY_USERNAME }}
          key: ${{ secrets.PRIVATE_KEY }}
          script: |
            cd /docker/mail_api || exit 1
            git pull || exit 2
            docker compose -f /docker/docker-compose.yml build professional_mail_api || exit 3
            docker compose -f /docker/docker-compose.yml up -d --no-build professional_mail_api herborn_mail_api || exit 4
            docker compose -f /docker/docker-compose.yml exec -T main_webserver nginx -t || exit 5
            docker compose -f /docker/docker-compose.yml exec -T main_webserver nginx -s reload || exit 6

