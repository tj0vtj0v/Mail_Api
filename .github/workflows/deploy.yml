name: Deploy Mail Api

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: deploy to server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ vars.DEPLOY_IP }}
          username: ${{ secrets.DEPLOY_USERNAME }}
          key: ${{ secrets.PRIVATE_KEY }}
          script: |
            cd /docker/mail_api || exit 1
            git pull || exit 2
            docker compose up -d --build mail_api || exit 3

